<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linkboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2.5' y='6' width='35' height='29' rx='4' fill='%23d9a86c' stroke='%23a8743a' stroke-width='2.4'/%3E%3Cg transform='rotate(-6 20 21)'%3E%3Crect x='10.5' y='11.5' width='19' height='17' rx='1.2' fill='%23fffbe3' stroke='%23d8c98f' stroke-width='.8'/%3E%3Crect x='13.5' y='18' width='13' height='1.6' rx='.8' fill='%239db3c9'/%3E%3Crect x='13.5' y='21.6' width='13' height='1.6' rx='.8' fill='%239db3c9'/%3E%3Crect x='13.5' y='25.2' width='8' height='1.6' rx='.8' fill='%239db3c9'/%3E%3C/g%3E%3Ccircle cx='20' cy='12.6' r='3.9' fill='%23e2533a' stroke='%23a8321f' stroke-width='1'/%3E%3Ccircle cx='18.8' cy='11.4' r='1.1' fill='%23fff' opacity='.75'/%3E%3C/svg%3E">
<style>:root{color-scheme:light}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#fff}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.LINKBOARD_SERVER=true</script>
</head><body>
<style>
/* Layout: classic link-aggregator — gray link strip, pale-blue header with stacked tabs, dense ranked listing left, 300px sidebar right */
:root{
  --bg:#ffffff; --fg:#222222; --muted:#888888; --faint:#c6c6c6; --link:#0000ff; --visited:#551a8b; --taglink:#336699;
  --head:#cee3f8; --head-line:#5f99cf; --tab:#eff7ff; --strip:#f0f0f0; --strip-line:#808080; --side:#f5f5f5; --line:#e5e5e5;
  --up:#ff8b60; --down:#9494ff; --flair:#f5f5f5; --btn:#e8f0fa; --btn-fg:#336699; --hl:#ffffe0; --odd:#f7f7f8; --even:#ffffff;
  --thumb:#e9e9e9; --thumb-fg:#a5a5a5; --bubble:#d3d3d3; --bubble-hover:#c4c4c4; --green:#228822;
  --font:verdana,arial,helvetica,sans-serif; --mono:"Courier New",monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font:normal x-small var(--font);font-size:10px;margin:0}
a{color:var(--taglink);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:1px dotted var(--fg);outline-offset:1px}

/* top strip */
.strip{background:var(--strip);border-bottom:1px solid var(--strip-line);font-size:10px;line-height:18px;height:18px;padding:0 16px;white-space:nowrap;overflow:hidden;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;position:relative}
.strip a{color:var(--fg)}
.strip a.on{color:#ff4500;font-weight:bold}
.strip .sep{color:var(--muted);margin:0 3px}
.dd{background:var(--bg);border:1px solid var(--strip-line);padding:0 3px;margin-right:6px;font-weight:bold;color:var(--fg);font-size:9px;line-height:13px;height:15px;text-transform:uppercase;display:inline-flex;gap:4px;align-items:center}
.ddmenu{position:absolute;top:18px;left:16px;background:var(--bg);border:1px solid var(--strip-line);z-index:5;display:flex;flex-direction:column;font-size:11px;text-transform:none;line-height:1.6;padding:2px 0;min-width:140px}
.ddmenu a{padding:0 8px;color:var(--fg)}
.ddmenu a:hover{background:var(--head);text-decoration:none}
.strip .more{margin-left:auto;padding-left:8px;font-weight:bold;background:var(--strip)}

/* header */
header{background:var(--head);border-bottom:1px solid var(--head-line);padding:0 16px;height:auto;min-height:49px;display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 6px;position:relative}
.logo{display:flex;align-items:flex-end;gap:4px;padding:3px 0 2px;color:var(--fg)}
.logo:hover{text-decoration:none}
.logo svg{display:block}
.logo b{font:bold 21px/1 arial,helvetica,sans-serif;letter-spacing:-1px;color:var(--fg);padding-bottom:2px}
.headstack{display:flex;flex-direction:column;align-items:flex-start;align-self:flex-end;margin-left:6px}
.boardname{font-size:13px;font-weight:bold;padding:0 0 2px 1px;text-transform:uppercase;letter-spacing:.3px;line-height:1}
.boardname:empty{display:none}
.boardname a{color:var(--fg)}
.boardname a{color:var(--fg)}
.tabs{display:flex;gap:0 2px;flex-wrap:wrap;margin:0;padding:0;align-self:flex-end}
.tabs a{display:block;background:var(--tab);border:1px solid var(--head-line);border-bottom:none;padding:1px 5px 0;font-weight:bold;font-size:10.5px;line-height:14px;color:var(--taglink);margin:0 2px -1px 0}
.tabs a.on{background:var(--bg);color:#ff4500;border-bottom:1px solid var(--bg);position:relative}
.user{position:absolute;right:0;bottom:0;font-size:11px;background:var(--tab);padding:4px 8px 4px 8px;border-top-left-radius:7px;color:var(--fg)}
.user b{color:var(--fg)}
.user .sep{color:var(--faint);margin:0 3px}
@media (max-width:760px){.user{position:static;margin-left:auto;border-radius:7px 7px 0 0;margin-top:4px}}

/* body */
.wrap{display:flex;gap:10px;padding:0 0 32px 0;align-items:flex-start;flex-direction:row}
main{flex:1;min-width:0;padding:7px 0 0 16px}
aside{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:0;padding:0 16px 0 5px;margin-top:4px}
aside>*{margin-bottom:10px}
@media (min-width:561px) and (max-width:1000px){main{padding-left:10px}}
@media (max-width:560px){.wrap{flex-direction:column;align-items:stretch}main{width:auto;max-width:100%;box-sizing:border-box}.title,.tagline,.xpnote,.c-text,.usertext,.msg .txt{overflow-wrap:anywhere}.banform input{min-width:0;flex-basis:100%}aside{width:auto;padding:0 16px}main{padding:7px 16px 0}}

/* listing */
.thing{display:flex;gap:0;padding:0;margin-bottom:8px;align-items:flex-start;min-height:52px}
.rank{width:24px;text-align:right;color:var(--faint);font-size:medium;font-family:arial,sans-serif;margin-top:15px;margin-right:2px;font-variant-numeric:tabular-nums;flex-shrink:0;line-height:1}
.vote{display:flex;flex-direction:column;align-items:center;width:5ex;min-width:38px;flex-shrink:0;margin:0 7px 0 2px;padding-top:2px}
.arrow{width:16px;height:15px;border:none;background:none;padding:0;color:#c6c6c6;margin:2px 0;cursor:pointer;border-radius:3px;transition:color .12s,transform .12s}
.arrow:hover{color:#a0a0a0}
.arrow.up:hover{color:#ffb08c}.arrow.down:hover{color:#b4b4ff}
.arrow:active{transform:scale(.85)}
.arrow:focus-visible{outline:1px dotted var(--fg);outline-offset:1px}
@keyframes votepop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.arrow.on svg{animation:votepop .22s ease-out}
@media (prefers-reduced-motion:reduce){.arrow,.arrow.on svg{transition:none;animation:none}}
.arrow svg{display:block;fill:currentColor;overflow:visible}
.arrow.up.on,.arrow.up.on:hover{color:#ff8b60} .arrow.down.on,.arrow.down.on:hover{color:#9494ff}
.score{font-weight:bold;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;line-height:1.1;text-align:center;font-family:arial,sans-serif}
.score.up{color:var(--up)} .score.down{color:var(--down)}
.thumb{width:70px;height:50px;flex-shrink:0;margin-right:5px;display:grid;place-items:center;color:var(--thumb-fg)}
.thumb .bubble{width:50px;height:50px;border-radius:50%;background:var(--bubble);display:grid;place-items:center}
.thumb:hover .bubble{background:var(--bubble-hover)}
.thumb.pic{background:var(--thumb)}
.thumb svg{display:block;fill:currentColor}
.thumb.pic{position:relative;overflow:hidden}
.entry{min-width:0;flex:1;padding-top:1px}
.title{font-size:16px;font-weight:normal;line-height:1.1;margin:0 0 1px}
.title a.t{color:var(--link);font-weight:normal;margin-right:.4em}
.title a.t:visited,.title a.t.seen{color:var(--visited)}
.domain{font-size:10px;color:var(--muted);white-space:nowrap}
.domain a{color:var(--muted)}
.flair{display:inline-block;font-size:10px;background:var(--flair);border:1px solid #ddd;padding:0 3px;border-radius:2px;margin-right:6px;line-height:normal;color:#545454;vertical-align:2px;font-weight:normal}
.flair.colored{color:#fff;border-color:transparent;font-weight:bold;font-size:12px;padding:1px 5px;vertical-align:1px}
.night .flair{border-color:var(--line);color:var(--muted)}
.tag{font-size:10px;padding:0 2px;margin-left:2px;font-weight:bold}
.tag.mod{color:var(--green)}
.tag.op{color:#fff;background:#0055df;border-radius:3px;padding:0 2px}
.tagline{font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tagline a{color:var(--taglink)}
.expando-btn{width:23px;height:23px;border:none;background:var(--bubble);border-radius:2px;padding:0;margin:3px 5px 0 0;flex-shrink:0;color:#fff;float:left}
.expando-btn:hover{background:var(--bubble-hover)}
.expando-btn svg{display:block}
.buttons{display:flex;gap:0 7px;font-size:10px;font-weight:bold;margin-top:1px;flex-wrap:wrap}
.buttons a{color:var(--muted)}
.buttons a:hover{text-decoration:underline}
.expando{margin:5px 0;overflow:hidden}
.nav{color:var(--muted);font-size:13px;margin:15px 0 0 30px}
.nav button{background:var(--strip);border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--taglink);font-weight:bold;font-size:13px}
.empty{color:var(--muted);padding:20px 0;font-size:12px}

/* post page */
.usertext{border:1px solid #369;background:var(--side);border-radius:7px;padding:5px 10px;max-width:60em;margin:5px 0;font-size:14px;line-height:1.4;font-family:var(--font)}
.usertext p{margin:0 0 .5em}
.usertext p:last-child{margin:0}
.commentarea{margin-top:0}
.panel{font-size:16px;color:var(--fg);margin:0 0 6px;border-bottom:1px dotted var(--faint);padding:10px 0 4px;font-weight:normal}
.panel .menu{font-size:10px;font-weight:normal;color:var(--muted);margin-top:4px}
.panel select{font:inherit;font-size:10px}
textarea,input[type=text],input[type=url],select{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:3px;border-radius:0}
textarea{width:100%;max-width:500px;height:100px;box-sizing:border-box;display:block;font-family:var(--font);font-size:13px}
.save{background:var(--strip);color:var(--fg);border:1px solid #c4c4c4;border-radius:3px;padding:1px 6px;margin-top:4px;font-size:12px}
.cancel{background:var(--strip);border:1px solid #c4c4c4;color:var(--fg);border-radius:3px;padding:1px 6px;margin:4px 0 0 4px;font-size:12px}
.comment{display:flex;gap:0;margin:8px 0 0;padding:0}
.kids .comment{border:1px solid var(--line);border-right:none;border-radius:3px 0 0 3px;padding:5px 0 5px 4px;margin:8px 0 0}
.kids .comment.odd{background:var(--odd)} .kids .comment.even{background:var(--even)}
.comment .vote{width:15px;margin:0 3px 0 0;padding-top:0}
.comment .vote .arrow{margin:1px 0;width:14px;height:13px}
.comment .vote .arrow svg{width:14px;height:13px}
.comment .body{flex:1;min-width:0}
.c-head{font-size:10px;color:var(--muted);line-height:1.3}
.c-head a.exp{color:var(--muted);margin-right:3px;font-family:var(--font)}
.c-head a.au{font-weight:bold;color:var(--taglink)}
.c-head .pts{color:var(--muted)}
.c-text{font-size:14px;line-height:1.35;max-width:60em;margin:2px 0 2px;font-family:var(--font)}
.c-text p{margin:.2em 0 .4em}
.collapsed .c-text,.collapsed .buttons,.collapsed .kids,.collapsed .replyslot{display:none}
.collapsed .vote .arrow{visibility:hidden}
.collapsed .c-head{font-style:italic;color:var(--faint)}
.collapsed .c-head a.au{color:var(--faint)}
.new>.body>.c-text{background:var(--hl)}

/* sidebar */
.search{position:relative;display:flex}
.search input{flex:1;min-width:0;width:100%;height:30px;box-sizing:border-box;padding:4px 30px 4px 8px;font-size:14px;border:1px solid #c7c7c7;border-radius:3px}
.search button{position:absolute;right:6px;top:7px;border:none;background:none;padding:0 2px;color:var(--muted)}
.box{background:var(--side);border:1px solid var(--line);padding:5px 8px}
.login{display:grid;grid-template-columns:1fr 1fr;gap:5px;border:1px solid #d6e3f4;background:var(--tab)}
.login input[type=text]{grid-column:span 1;min-width:0;width:100%;box-sizing:border-box}
.login .row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}
.login .row label{display:flex;gap:3px;align-items:center}
.login .save{margin:0}
.bigbtn{display:block;position:relative;box-sizing:border-box;width:calc(100% - 26px);height:30px;line-height:28px;padding:0 0 0 18px;margin-right:26px;background:linear-gradient(#f2f7fd,#dce9f8);border:1px solid #c6d8ee;border-right:none;border-radius:3px 0 0 3px;font:bold 15px var(--font);color:var(--taglink);text-align:center;overflow:visible;white-space:nowrap;transition:none}
.bigbtn::after{content:"";position:absolute;top:-1px;right:-26px;width:26px;height:30px;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2026%2030'%20preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23f2f7fd'/%3E%3Cstop%20offset='1'%20stop-color='%23dce9f8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0Z'%20fill='url%28%23g%29'/%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0'%20fill='none'%20stroke='%23c6d8ee'%20stroke-width='1'%20stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat;background-size:100% 100%;pointer-events:none}
.bigbtn:hover{background:linear-gradient(#e9f2fc,#cfe1f5);border-color:#9fbde0;text-decoration:none}
.bigbtn:hover::after{background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2026%2030'%20preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23e9f2fc'/%3E%3Cstop%20offset='1'%20stop-color='%23cfe1f5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0Z'%20fill='url%28%23g%29'/%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0'%20fill='none'%20stroke='%239fbde0'%20stroke-width='1'%20stroke-linejoin='round'/%3E%3C/svg%3E")}
.bigbtn:active{background:linear-gradient(#cfe1f5,#e9f2fc)}
.bigbtn:focus-visible{outline:1px dotted var(--fg);outline-offset:2px}
.night .bigbtn{background:linear-gradient(#26313d,#1f2a36);border-color:#3a4b5e;color:#9cc3ef}
.night .bigbtn::after{background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2026%2030'%20preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2326313d'/%3E%3Cstop%20offset='1'%20stop-color='%231f2a36'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0Z'%20fill='url%28%23g%29'/%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0'%20fill='none'%20stroke='%233a4b5e'%20stroke-width='1'%20stroke-linejoin='round'/%3E%3C/svg%3E")}
.night .bigbtn:hover{background:linear-gradient(#2c3a48,#24313f);border-color:#4f6a86}
.night .bigbtn:hover::after{background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2026%2030'%20preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%232c3a48'/%3E%3Cstop%20offset='1'%20stop-color='%2324313f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0Z'%20fill='url%28%23g%29'/%3E%3Cpath%20d='M0%20.5H1L24.6%2014.2Q25.6%2015%2024.6%2015.8L1%2029.5H0'%20fill='none'%20stroke='%234f6a86'%20stroke-width='1'%20stroke-linejoin='round'/%3E%3C/svg%3E")}
.sidebox{display:flex;flex-direction:column;gap:0}
.sidebox .bigbtn+.bigbtn{margin-top:13px}
.sideblurb{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--fg);margin:2px 0 0 4px;line-height:1.4}
.sideblurb svg{flex-shrink:0}
.titlebox h1{font-size:18px;margin:0 0 3px;font-weight:bold}
.titlebox h1 a{color:var(--fg)}
.sub-btn{background:#5cb85c;color:#fff;border:1px solid #4a9a4a;border-radius:3px;padding:1px 5px;font-weight:bold;font-size:10px;margin-right:4px}
.sub-btn.on{background:#d9534f;border-color:#b8433f}
.side-desc{font-size:12px;line-height:1.4;font-family:var(--font)}
.side-desc p{margin:.5em 0}
.side-desc h4{font-size:12px;margin:10px 0 2px;border-bottom:1px solid var(--line)}
.side-desc ol{padding-left:22px;margin:4px 0}
.stat{font-size:10px;color:var(--muted);margin:6px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5cb85c;margin-right:4px;vertical-align:1px}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:12px;display:block;font-weight:normal}
.age{font-size:10px;color:var(--muted);margin-top:3px}
.mods h4{font-size:10px;color:var(--muted);margin:0 0 4px;text-transform:uppercase;font-weight:bold}
.mods a{font-size:11px;display:block;line-height:1.5}
footer{background:var(--side);border-top:1px solid var(--line);margin-top:30px;padding:15px 16px 10px;font-size:10px}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:720px;margin:0 auto}
.fcols b{display:block;color:var(--fg);font-size:11px;margin-bottom:3px;border-bottom:1px solid var(--line);padding-bottom:2px}
.fcols a{display:block;line-height:1.6}
.legal{text-align:center;color:var(--muted);margin-top:14px}

/* submit */
.submit-form{max-width:560px;display:flex;flex-direction:column;gap:8px}
.submit-form .sp{background:var(--tab);border:1px solid #d6e3f4;padding:6px 10px 10px;display:flex;flex-direction:column;gap:4px}
.submit-form label{font-weight:bold;font-size:12px}
.submit-form label .req{color:#ff4500}
.submit-form input,.submit-form select{width:100%;box-sizing:border-box}
.submit-form textarea{max-width:none}
.formtabs{display:flex;gap:2px;border-bottom:1px solid var(--head-line);margin-bottom:8px}
.formtabs button{background:var(--tab);border:1px solid var(--head-line);border-bottom:none;padding:2px 10px;font-weight:bold;color:var(--taglink);font-size:12px;margin-bottom:-1px}
.formtabs button.on{background:var(--bg);color:#ff4500}
.err{color:#d00;font-size:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:3px;font-size:12px;z-index:9}

.menuarea{font-size:10px;color:var(--muted);margin:0 0 8px 30px}
.menuarea select{font-size:10px;padding:0}
.nsfw{color:#d10023;border:1px solid #d10023;border-radius:3px;padding:0 2px;font-size:10px;margin-left:5px;font-weight:bold;vertical-align:2px;text-transform:uppercase;line-height:1}
.spoiler{color:#555;border:1px solid #999;border-radius:3px;padding:0 2px;font-size:10px;margin-left:5px;font-weight:bold;vertical-align:2px;text-transform:uppercase;line-height:1}
.edited{color:var(--muted);margin-left:1px;cursor:help}
.is-hidden{opacity:.55}

 #chatdock{left:0;right:0}

  else if(code==='invalid_argument'&&SERVER)toast('that change was not accepted. reload the page and try again.');
  else if(code==='invalid_argument'&&!readOnly){readOnly=true;toast('you have view-only access here, so you can read but not post or vote')}

  else toast('that did not save. check your connection and try again.');
  refreshMain();
}

const MAXDEPTH=5;

function sortComments(cs){

function commentHTML(c,p,depth,parent){

  const pts=score(c), del=c.deleted, rem=isRemoved(c,p.b), mod=isModOf(p.b), hideText=rem&&!mod&&!isMine(c), locked=isLocked(p)||isArchived(p);

   ${voteHTML('c',c.id,c.v,0,false)}

function userItems(u){
  const items=[];
  if(S.utab==='overview'||S.utab==='submitted')for(const p of posts)if(p.u===u)items.push({k:'p',o:p,t:p.time,sc:score(p)});
  if(S.utab==='overview'||S.utab==='comments')walk((c,p,parent)=>{if(c.u===u&&!c.deleted)items.push({k:'c',o:c,p,parent,t:c.t,sc:score(c)})});
  if(S.utab==='saved'){for(const p of posts)if(p.saved)items.push({k:'p',o:p,t:p.time,sc:score(p)});walk((c,p,parent)=>{if(c.saved)items.push({k:'c',o:c,p,parent,t:c.t,sc:score(c)})})}
  if(S.utab==='hidden')for(const p of posts)if(p.hidden)items.push({k:'p',o:p,t:p.time,sc:score(p)});
  if((S.utab==='upvoted'||S.utab==='downvoted')&&u===me.name)for(const p of posts)if(S.utab==='upvoted'?p.v>0&&!isMine(p):p.v<0)items.push({k:'p',o:p,t:p.time,sc:score(p)});
  return items.sort(S.usort==='top'?(a,b)=>b.sc-a.sc:(a,b)=>b.t-a.t);
}

function routeFor(st){
  const enc=encodeURIComponent;
  if(st.view==='post'&&st.post){const p=postById(st.post);return`#/b/${enc(p?.b||st.board||'x')}/comments/${enc(st.post)}${st.focus?'/c/'+enc(st.focus):''}`}
  if(st.view==='user'&&st.user)return`#/u/${enc(st.user)}${st.utab&&st.utab!=='overview'?'/'+st.utab:''}`;
  if(st.view==='wiki'&&st.board)return`#/b/${enc(st.board)}/wiki/${enc(st.wikiPage||'index')}`;
  if(st.view==='listing'){
    if(st.domain)return`#/domain/${enc(st.domain)}`;
    if(st.q)return`#/search/${enc(st.q)}`;
    if(st.multi)return`#/m/${enc(st.multi)}${st.sort&&st.sort!=='hot'?'/'+st.sort:''}`;
    if(['all','popular','friends'].includes(st.board))return`#/${st.board}${st.sort&&st.sort!==(st.board==='friends'?'new':'hot')?'/'+st.sort:''}`;
    if(st.board)return`#/b/${enc(st.board)}${st.sort&&st.sort!=='hot'?'/'+st.sort:''}`;
    return st.sort&&st.sort!=='best'?`#/${st.sort}`:'#/';
  }
  return{inbox:'#/message/inbox',compose:'#/message/compose',prefs:'#/prefs',submit:'#/submit',login:'#/login',users:'#/users',boards:'#/boards',createboard:'#/boards/create'}[st.view]||'#/';
}

/* ---------- image and video uploads ----------
   The server says how uploads work: 'cloudinary' (files go straight from the browser to your Cloudinary account),
   'local' (files are saved on the server's own disk) or 'off'. The browser-only preview keeps them in IndexedDB. */
let SERVER_UPLOADS='off';
const uploadMode=()=>SERVER?(SERVER_UPLOADS!=='off'&&me.name?SERVER_UPLOADS:''):(!SHARED?'preview':'');
const UPLOAD_ACCEPT='image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime';
const UPLOAD_MAX={image:20*1024*1024,video:100*1024*1024};
const fileKind=f=>/^image\/(png|jpeg|gif|webp)$/.test(f.type)?'image':/^video\/(mp4|webm|quicktime)$/.test(f.type)?'video':null;
const MEDIA_DB='linkboard-media';
function mediaDb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(MEDIA_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadPreviewMedia(){
  try{const db=await mediaDb();const tx=db.transaction('files','readonly'),st=tx.objectStore('files');
    const req=st.openCursor();let n=0;
    await new Promise(res=>{req.onsuccess=()=>{const c=req.result;if(c){if(!PREVIEW_MEDIA[c.key]){PREVIEW_MEDIA[c.key]=URL.createObjectURL(c.value);n++}c.continue()}else res()};req.onerror=()=>res()});
    if(n)render();
  }catch(e){}
}
async function savePreviewMedia(id,file){
  PREVIEW_MEDIA[id]=URL.createObjectURL(file);
  try{const db=await mediaDb();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}
  catch(e){return false}
}
function xhrUpload(method,url,body,headers,onProgress){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open(method,url);
    for(const[k,v] of Object.entries(headers||{}))x.setRequestHeader(k,v);
    x.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded/e.total)};
    x.onload=()=>{let j=null;try{j=JSON.parse(x.responseText)}catch(e){}if(x.status>=200&&x.status<300&&j)res(j);else rej({message:j?.error?.message||j?.error||`upload failed (${x.status})`})};
    x.onerror=()=>rej({message:'the upload was interrupted. check your connection and try again.'});
    x.send(body);
  });
}
async function uploadFile(file,onProgress){
  const kind=fileKind(file);
  if(!kind)throw{message:'that file type isn\'t supported. use a jpg, png, gif or webp image, or an mp4, webm or mov video.'};
  if(file.size>UPLOAD_MAX[kind])throw{message:`that ${kind} is too big. ${kind==='image'?'images':'videos'} can be up to ${UPLOAD_MAX[kind]/1048576} MB.`};
  const d=kind==='image'?'i.linkboard':'v.linkboard';
  if(!SERVER){
    const id=newId('m');onProgress(1);
    const kept=await savePreviewMedia(id,file);
    if(!kept)toast('this browser won\'t keep the file, so it will disappear when you reload');
    return{url:'lbmedia:'+id,kind,d};
  }
  if(SERVER_UPLOADS==='cloudinary'){
    const sig=await api('/api/upload/sign',{kind});
    const fd=new FormData();
    fd.append('file',file);fd.append('api_key',sig.apiKey);fd.append('timestamp',sig.timestamp);fd.append('folder',sig.folder);fd.append('signature',sig.signature);
    const r=await xhrUpload('POST',`https://api.cloudinary.com/v1_1/${encodeURIComponent(sig.cloud)}/${kind}/upload`,fd,{},onProgress);
    if(!r.secure_url)throw{message:'the upload didn\'t finish. try again.'};
    // ask Cloudinary for a web-sized copy: smaller files, the right format for each browser
    const url=r.secure_url.replace('/upload/',kind==='image'?'/upload/f_auto,q_auto,c_limit,w_1600/':'/upload/q_auto,c_limit,w_1280/');
    return{url,kind,d};
  }
  const r=await xhrUpload('POST','/api/upload',file,{'Content-Type':file.type,'X-Linkboard':'1'},onProgress);
  return{url:location.origin+r.url,kind,d};
}
function showUpload(){
  const prev=$('#uplprev');if(!prev)return;

  if(!u){prev.innerHTML='';return}
  const src=esc(mediaSrc(u.url));
  prev.innerHTML=`${u.kind==='image'?`<img src="${src}" alt="your upload">`:`<video src="${src}" controls playsinline preload="metadata"></video>`}<div><a data-act="unupload">remove</a></div>`;
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='f-file')return;

  errEl.textContent='';S.upload=null;showUpload();

    const u=await uploadFile(file,f=>{bar.style.width=Math.round(f*100)+'%'});

/* ---------- chat: live one-to-one and group conversations, in a window docked at the bottom right ----------
   Separate from private messages, as on the classic site. On the self-hosted server everything goes through
   /api/chats, /api/chat and /api/chat/*, and new messages arrive over the live connection. In the browser-only
   preview the same calls are answered from this browser's storage, and nobody else is there to reply. */
const CH={open:false,min:false,view:'list',list:[],cur:null,data:null,uid:undefined,err:'',prefill:'',drafts:{},busy:false};
const chatOn=()=>!!me.name&&(SERVER?!!myUid:!SHARED);
const CHAT_KEY='linkboard-chat-v1';
function chatLocal(path,body){
  let d;try{d=JSON.parse(localStorage.getItem(CHAT_KEY))||{chats:{}}}catch(e){d={chats:{}}}
  const save=()=>{try{localStorage.setItem(CHAT_KEY,JSON.stringify(d))}catch(e){}};
  const meN=me.name,err=(code,message)=>{throw{code,message}};
  const known=n=>{const l=String(n).toLowerCase();return [...NAMES,...posts.map(p=>p.u)].find(x=>String(x).toLowerCase()===l)};
  const view=c=>{const msgs=c.msgs.filter(m=>m.sys||m.from===meN||!isBlocked(m.from)),last=msgs[msgs.length-1],seen=(c.read||{})[meN]||0;
    return{id:c.id,group:!!c.group,name:c.name||'',creator:c.creator,members:c.members.slice(),pair:c.pair,pending:!!c.pending[meN],
      waiting:c.members.filter(u=>u!==meN&&c.pending[u]),unread:msgs.filter(m=>!m.sys&&m.from!==meN&&m.t>seen).length,
      last:last?{from:last.sys?null:last.from,txt:last.txt.slice(0,120),t:last.t,sys:!!last.sys}:null,t:last?last.t:c.created}};
  const sys=(c,txt)=>c.msgs.push({id:newId('cm'),from:null,sys:true,txt,t:Date.now()});
  const all=Object.values(d.chats).filter(c=>c.members.includes(meN));
  if(path==='/api/chats')return{chats:all.map(view).sort((a,b)=>b.t-a.t)};
  if(path==='/api/chat/start'){
    const names=[];for(const n of String(body.to||'').split(/[\s,]+/).map(x=>x.trim().replace(/^\/?u\//,'')).filter(Boolean)){const k=known(n);if(!k)err('no_user',`there is no user named ${n.slice(0,30)}`);if(k!==meN&&!names.includes(k))names.push(k)}
    if(!names.length)err('invalid_argument','add at least one other person');
    if(names.length>19)err('invalid_argument','a chat can have up to 20 people');
    const name=String(body.name||'').trim().slice(0,60),group=names.length>1||!!name;
    if(!group){const ex=all.find(c=>!c.group&&c.members.length===2&&c.members.includes(names[0]));if(ex)return{id:ex.id}}
    const c={id:newId('ch'),name,group,creator:meN,created:Date.now(),members:[meN,...names],pair:group?undefined:[meN,names[0]],pending:Object.fromEntries(names.map(n=>[n,true])),read:{[meN]:Date.now()},msgs:[]};
    if(group)sys(c,`${meN} started the chat`);
    d.chats[c.id]=c;save();return{id:c.id};
  }
  const c=d.chats[body?.id];if(!c||!c.members.includes(meN))err('no_chat','no such chat');
  if(path==='/api/chat')return{chat:view(c),msgs:c.msgs.filter(m=>m.sys||m.from===meN||!isBlocked(m.from)).slice(-200),read:{}};
  if(path==='/api/chat/send'){const txt=String(body.txt||'').trim().slice(0,2000);if(!txt)err('invalid_argument','write a message first');delete c.pending[meN];c.msgs.push({id:newId('cm'),from:meN,txt,t:Date.now()});c.msgs=c.msgs.slice(-500);c.read[meN]=Date.now()}
  else if(path==='/api/chat/read'||path==='/api/chat/accept'){delete(path==='/api/chat/accept'?c.pending:{})[meN];c.read[meN]=Date.now()}
  else if(path==='/api/chat/leave'){const wp=!!c.pending[meN];c.members=c.members.filter(u=>u!==meN);delete c.pending[meN];if(!c.members.length)delete d.chats[c.id];else if(c.group&&!wp)sys(c,`${meN} left the chat`)}
  else if(path==='/api/chat/rename'){c.name=String(body.name||'').trim().slice(0,60);sys(c,c.name?`${meN} named the chat "${c.name}"`:`${meN} removed the chat's name`)}
  else if(path==='/api/chat/add'){const k=known(String(body.user||'').trim().replace(/^\/?u\//,''));if(!k)err('no_user','no such user');if(c.members.includes(k))err('invalid_argument',`${k} is already in this chat`);if(c.members.length>=20)err('invalid_argument','a chat can have up to 20 people');c.members.push(k);c.pending[k]=true;sys(c,`${meN} added ${k}`)}
  save();return{ok:true};
}
const chatCall=(path,body)=>SERVER?api(path==='/api/chat'?'/api/chat?id='+encodeURIComponent(body.id):path,path==='/api/chats'||path==='/api/chat'?undefined:body):Promise.resolve().then(()=>chatLocal(path,body));
const chatTitle=c=>c.group?(c.name||c.members.filter(n=>n!==me.name).join(', ')||'just you'):((c.pair||c.members).find(n=>n!==me.name)||'[deleted]');
const chatBadge=()=>CH.list.reduce((n,c)=>n+(c.pending?1:c.unread),0);
const chatTime=t=>{const d=new Date(t),now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})};
const chatTxt=s=>esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)'"]/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`).replace(/\n/g,'<br>');
let chatTimer=null;
const chatRefreshSoon=()=>{clearTimeout(chatTimer);chatTimer=setTimeout(chatRefresh,120)};
async function chatRefresh(){
  if(!chatOn()){CH.list=[];CH.data=null;renderChat();chatIcon();return}
  try{
    CH.list=(await chatCall('/api/chats')).chats;
    if(CH.cur){
      if(!CH.list.some(c=>c.id===CH.cur)){CH.cur=null;CH.data=null;if(CH.view==='chat')CH.view='list'}
      else{CH.data=await chatCall('/api/chat',{id:CH.cur});
        const c=CH.list.find(x=>x.id===CH.cur);
        if(CH.open&&!CH.min&&!document.hidden&&c.unread&&!c.pending){c.unread=0;chatCall('/api/chat/read',{id:CH.cur}).catch(()=>{})}}
    }
  }catch(e){}
  renderChat();chatIcon();
}
function chatIcon(){
  const el=document.querySelector('#userbox .chaticon');if(!el)return;
  const n=chatBadge();el.classList.toggle('has',!!n);el.title=n?plural(n,'unread chat message'):'chat';
  const b=el.querySelector('.mailcount');if(n){if(b)b.textContent=n;else el.insertAdjacentHTML('beforeend',`<span class="mailcount">${n}</span>`)}else if(b)b.remove();
}
const chatIconHtml=()=>{const n=chatBadge();return`<a class="chaticon ${n?'has':''}" data-chat="toggle" title="${n?plural(n,'unread chat message'):'chat'}"><svg width="15" height="13" viewBox="0 0 15 13" aria-hidden="true"><path d="M2 .5h11A1.5 1.5 0 0 1 14.5 2v6A1.5 1.5 0 0 1 13 9.5H7L3.5 12.3V9.5H2A1.5 1.5 0 0 1 .5 8V2A1.5 1.5 0 0 1 2 .5Z" fill="${n?'#ff4500':'none'}" stroke="currentColor"/><path d="M4 4h7M4 6.3h5" stroke="${n?'#fff':'currentColor'}"/></svg>${n?`<span class="mailcount">${n}</span>`:''}</a>`};
function renderChat(){
  let dock=$('#chatdock');
  if(!dock){document.body.insertAdjacentHTML('beforeend','<div id="chatdock" hidden></div>');dock=$('#chatdock')}

  const reqs=CH.list.filter(c=>c.pending),convs=CH.list.filter(c=>!c.pending);

  if(CH.view==='new')main=`<form class="chatnewform" id="chatnewform"><div class="chathead"><b>start a chat</b></div><div class="chatpad">
     <label for="chat-to">with</label><input id="chat-to" type="text" placeholder="username, or several separated by commas" value="${esc(CH.prefill)}" autocomplete="off" spellcheck="false">
     <label for="chat-name">group name <span class="hint">(optional)</span></label><input id="chat-name" type="text" maxlength="60" placeholder="only for group chats">
     <div class="err" role="alert">${esc(CH.err)}</div><button class="save">start chat</button>
     <p class="hint">people who haven't added you as a friend get your chat as a request they can accept or ignore.${SERVER?'':' this preview keeps chats in your browser. to reply as the other person, switch to them with "testing as" at the top of this window.'}</p></div></form>`;
  else if(CH.view==='chat'&&CH.data){
    const c=CH.data.chat,title=chatTitle(c),msgs=CH.data.msgs;
    const lastMine=[...msgs].reverse().find(m=>m.from===me.name&&!m.sys);

    const seen=lastMine&&other&&CH.data.read&&CH.data.read[other]>=lastMine.t;
    let prev=null;
    const lines=msgs.map(m=>{if(m.sys){prev=null;return`<div class="csys">${esc(m.txt)} <span class="ctime">${chatTime(m.t)}</span></div>`}
      const head=!prev||prev.from!==m.from||m.t-prev.t>5*60e3;prev=m;
      return`<div class="cmsg ${m.from===me.name?'mine':''} ${head?'head':''}">${head?`<div class="cmeta"><a data-user="${esc(m.from)}" class="cfrom">${esc(m.from)}</a> <span class="ctime" title="${new Date(m.t).toLocaleString()}">${chatTime(m.t)}</span></div>`:''}<div class="ctxt">${chatTxt(m.txt)}</div></div>`}).join('');
    main=`<div class="chathead"><span class="ctitle">${c.group?esc(title):`<a data-user="${esc(title)}">${esc(title)}</a>`}</span>
       <span class="chatacts">${c.group&&!c.pending?`<a data-chat="add">add</a><a data-chat="rename">rename</a>`:''}<a data-chat="leave">${c.group?'leave':'hide'}</a></span>
       ${c.group?`<div class="cmembers">${c.members.map(x=>`<a data-user="${esc(x)}">${esc(x)}</a>`).join(', ')}</div>`:''}</div>
     ${c.pending?`<div class="chatreq"><b>${esc(c.creator===me.name?title:c.creator)}</b> wants to chat with you. you can accept, ignore it, or block them.<div><button data-chat="accept" class="save">accept</button><button data-chat="ignore">ignore</button>${c.group?'':`<button data-chat="block">block</button>`}</div></div>`:''}
     ${c.waiting.length&&!c.pending?`<div class="chatwait">waiting for ${c.waiting.map(esc).join(', ')} to accept your chat request.</div>`:''}

    <div class="chatbody"><div class="chatlist"><a class="chatnew" data-chat="new">+ start a chat</a>

      ${convs.length?`<div class="chatsec">conversations</div>${convs.map(item).join('')}`:reqs.length?'':'<div class="cnone">no conversations yet</div>'}</div>

  const nb=$('#chatmsgs');if(nb)nb.scrollTop=atBottom||!box?nb.scrollHeight:oldTop;
  const ni=$('#chatinput');if(ni){ni.value=CH.drafts[CH.cur]||'';if(keep?.f||CH.focus){ni.focus();CH.focus=false}}
  if(CH.view==='new'){const t=$('#chat-to');if(t&&CH.focus){t.focus();CH.focus=false}}
}
async function chatDo(path,body,after){
  if(CH.busy)return;CH.busy=true;
  try{const r=await chatCall(path,body);if(after)await after(r)}
  catch(e){toast(e?.message||'something went wrong')}
  finally{CH.busy=false}
  await chatRefresh();
}
// preview only: everyone lives in this one browser, so you can switch to another person to see the other side of a chat
function chatAsHtml(){
  let d;try{d=JSON.parse(localStorage.getItem(CHAT_KEY))||{chats:{}}}catch(e){d={chats:{}}}
  const names=[...new Set([me.name,'preview_user',...Object.values(d.chats).flatMap(c=>c.members)])].filter(Boolean);
  return`<label class="chatas">testing as <select id="chatas" aria-label="Test chat as">${names.map(n=>`<option ${n===me.name?'selected':''}>${esc(n)}</option>`).join('')}<option value="">someone else…</option></select></label>`;
}
function chatSwitchTo(n){
  if(!n){n=prompt('switch to which user? (anyone who has posted or commented)');if(!n)return renderChat();const l=n.trim().replace(/^\/?u\//,'').toLowerCase();n=[...NAMES,...posts.map(p=>p.u),'preview_user'].find(x=>String(x).toLowerCase()===l);if(!n){toast('there is no user with that name');return renderChat()}}

document.addEventListener('change',e=>{if(e.target.id==='chatas')chatSwitchTo(e.target.value)});
// another tab of the preview changed the chats: show it here too
window.addEventListener('storage',e=>{if(e.key===CHAT_KEY&&!SERVER)chatRefreshSoon()});
function chatSync(){const k=chatOn()?(SERVER?myUid:me.name):null;if(k===CH.uid)return;const keepOpen=!SERVER&&CH.open&&!!k;CH.uid=k;CH.list=[];CH.cur=null;CH.data=null;CH.view='list';if(!k||!keepOpen)CH.open=keepOpen;if(SERVER&&clientId)sendPresence();setTimeout(chatRefresh,0)}
function chatOpen(id){CH.open=true;CH.min=false;CH.cur=id;CH.view='chat';CH.focus=true;CH.data=null;chatRefresh()}
function chatStartWith(name){if(needLogin())return;CH.open=true;CH.min=false;const ex=CH.list.find(c=>!c.group&&(c.pair||c.members).some(n=>String(n).toLowerCase()===String(name).toLowerCase())&&c.members.includes(me.name));if(ex)return chatOpen(ex.id);CH.view='new';CH.prefill=name;CH.err='';CH.focus=true;renderChat()}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-chat]');if(!a)return;
  e.preventDefault();e.stopPropagation();
  const[act,arg]=a.dataset.chat.split(/:(.*)/);
  const c=CH.data?.chat;
  switch(act){
    case'toggle':if(needLogin())return;CH.open=!CH.open||CH.min;CH.min=false;if(CH.open&&!CH.cur&&CH.view==='chat')CH.view='list';chatRefresh();break;
    case'min':CH.min=true;renderChat();break;

    case'close':CH.open=false;renderChat();break;
    case'back':CH.view='list';CH.cur=null;CH.data=null;renderChat();break;

document.addEventListener('keydown',e=>{if(e.target.id==='chatinput'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit()}

document.addEventListener('click',e=>{const sp=e.target.closest('.md-spoiler');if(sp){sp.classList.add('revealed');e.stopPropagation()}},true);

document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('#ddmenu');if(m)m.hidden=true}});
render();
if(SERVER)startServer();else if(CLAUDE_LIVE)startLive();
else if(PREVIEW){loadPreviewMedia();if(!window.__restored||!me.name)me={name:me.name||'preview_user',created:me.created||Date.now()-400*24*H};S.board='popular';S.sort='hot';render()}
